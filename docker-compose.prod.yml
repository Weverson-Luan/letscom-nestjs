services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: letscom-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prisma-network

  postgres:
    image: postgres:16
    container_name: letscom-bd
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      ## a cada 10s testa se o Postgres aceita conexão. 5 tentativas, 30s de graça no boot.
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      ## os dados ficam num volume Docker, não no container. docker compose down não apaga o banco. Só some com docker compose down -v.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prisma-network
    logging:
      ## limita logs a 10 arquivos de 10 MB para não encher disco.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

networks:
  prisma-network:
    driver: bridge

volumes:
  postgres_data: ## volumes persistentes gerenciados pelo Docker
  app_node_modules:
