## nome do projeto separado do dev: volumes, rede e containers não se misturam
name: letscom-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: letscom-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      ## uploads locais (FILESYSTEM_DISK=local) e logs sobrevivem à recriação do container
      - app_storage:/app/storage
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - letscom-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  mysql:
    image: mysql:8.4
    container_name: letscom-bd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      TZ: America/Sao_Paulo
    ## sem "ports": o banco só é acessível pela rede interna do compose
    healthcheck:
      ## a cada 10s testa se o MySQL aceita conexão. 5 tentativas, 30s de graça no boot.
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      ## os dados ficam num volume Docker, não no container. docker compose down não apaga o banco. Só some com docker compose down -v.
      - mysql_data:/var/lib/mysql
    networks:
      - letscom-network
    logging:
      ## limita logs a 10 arquivos de 10 MB para não encher disco.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  redis:
    image: redis:7-alpine
    container_name: letscom-redis
    restart: unless-stopped
    ## senha vazia = sem autenticação
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - letscom-network

networks:
  letscom-network:
    driver: bridge

volumes:
  mysql_data: ## volumes persistentes gerenciados pelo Docker
  app_storage:
  app_logs:
