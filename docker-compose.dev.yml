## nome do projeto separado do prod: volumes, rede e containers não se misturam
name: letscom-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: letscom-api-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
    volumes:
      ## código da máquina montado no container para hot reload
      - .:/app
      ## node_modules fica no volume (binários linux), não no da máquina
      - app_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - letscom-network

  mysql:
    image: mysql:8.4
    container_name: letscom-bd-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env}
      TZ: America/Sao_Paulo
    ports:
      ## exposto no host em dev para acessar via DBeaver/prisma studio
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      ## a cada 10s testa se o MySQL aceita conexão. 5 tentativas, 30s de graça no boot.
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      ## os dados ficam num volume Docker, não no container. docker compose down não apaga o banco. Só some com docker compose down -v.
      - mysql_data:/var/lib/mysql
    networks:
      - letscom-network
    logging:
      ## limita logs a 10 arquivos de 10 MB para não encher disco.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  redis:
    image: redis:7-alpine
    container_name: letscom-redis-dev
    restart: unless-stopped
    ## senha vazia = sem autenticação
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-}" ]
    ports:
      ## exposto no host em dev para a API rodando fora do container (npm run start:dev)
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - letscom-network

networks:
  letscom-network:
    driver: bridge

volumes:
  mysql_data: ## volumes persistentes gerenciados pelo Docker
  app_node_modules:
